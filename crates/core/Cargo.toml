[package]
name = "cb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core logic for code-basics: project detection, test adapters, process supervision and git operations."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
quick-xml.workspace = true
git2.workspace = true
dunce.workspace = true
walkdir.workspace = true
globset.workspace = true
toml.workspace = true
regex.workspace = true
specta.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# A scripted stand-in for a language server. It exists so the transport's
# failure modes — a server that dies mid-request, one that never answers, one
# that emits a broken frame — are testable on a machine with no language server
# installed. Integration tests locate it with `env!("CARGO_BIN_EXE_cb-fake-lsp")`,
# which needs no build script.
[[bin]]
name = "cb-fake-lsp"
path = "src/bin/fake_lsp.rs"
