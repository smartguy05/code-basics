[package]
name = "cb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core logic for code-basics: project detection, test adapters, process supervision and git operations."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
quick-xml.workspace = true
git2.workspace = true
dunce.workspace = true
walkdir.workspace = true
globset.workspace = true
toml.workspace = true
regex.workspace = true
sqlparser.workspace = true
futures-core.workspace = true
sqlx.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
specta.workspace = true
uuid.workspace = true
yaml-rust2.workspace = true

# Cross-platform pseudo-terminal for the interactive floating terminals
# (ConPTY on Windows, forkpty on Unix). The only place the app opens a PTY;
# `process::Supervisor` stays stdin-null and output-only.
portable-pty = "0.9"

# HTTP replay for behavioral before/after testing. Blocking client only (the
# replay layer is synchronous and the command wraps it in `spawn_blocking`);
# rustls so no system OpenSSL is needed on Windows.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }

# Cross-platform process liveness + identity (image name, start time) behind the
# Running panel's orphan detection: the one thing that lets a leftover process
# from a crashed session be found and — after an identity re-check that guards
# against PID reuse — killed safely. No default features (we only read one pid at
# a time); `system` carries the process API we use.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Integrated (Windows) authentication for the SQL Server driver. Split out
# rather than enabled in `[dependencies]` because the `winauth` crate tiberius
# pulls in for it does not compile off Windows, and a Linux build of `cb-core`
# must keep working. Cargo unions features per target, so this is additive to
# the workspace entry rather than a second copy of the dependency.
[target.'cfg(windows)'.dependencies]
tiberius = { workspace = true, features = ["winauth"] }

[dev-dependencies]
tempfile = "3"

# A scripted stand-in for a language server. It exists so the transport's
# failure modes — a server that dies mid-request, one that never answers, one
# that emits a broken frame — are testable on a machine with no language server
# installed. Integration tests locate it with `env!("CARGO_BIN_EXE_cb-fake-lsp")`,
# which needs no build script.
[[bin]]
name = "cb-fake-lsp"
path = "src/bin/fake_lsp.rs"
