# Rust tests via cargo-nextest, which can emit JUnit XML.
#
# Copy to `.code-basics/adapters/cargo-nextest.toml`.
#
# nextest writes its JUnit report to a path fixed by its own configuration
# rather than a command-line flag, so this manifest points the app at where
# nextest puts it. Add the following to `.config/nextest.toml` in the project:
#
#     [profile.default.junit]
#     path = "junit.xml"
#
# nextest then writes `target/nextest/default/junit.xml`.

id = "cargo-nextest"
name = "cargo nextest"
detect = ["Cargo.toml"]

[test]
program = "cargo"
args = ["nextest", "run", "--color", "always"]
report_format = "junitXml"
report_extension = "xml"

# nextest filters by a substring of the test name.
filter_template = "-E"
filter_separator = " or "

[run.build]
program = "cargo"
args = ["build"]

[run.release]
program = "cargo"
args = ["run", "--release"]
